[project]
name = "api-gateway"
version = "0.1.0"
description = "Vana-Rakshak health and configuration API"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "httpx==0.28.1",
  "redis==8.1.0",
  "uvicorn[standard]==0.35.0",
  "wildfire-core",
]

[tool.uv.sources]
wildfire-core = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_gateway"]
