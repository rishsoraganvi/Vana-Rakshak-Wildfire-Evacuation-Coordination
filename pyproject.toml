[project]
name = "vana-rakshak"
version = "0.1.0"
description = "Vana-Rakshak wildfire evacuation coordination foundation"
requires-python = ">=3.11,<3.13"
dependencies = [
  "agent-routing",
  "coordinator",
  "alembic==1.20.0",
  "fastapi==0.142.2",
  "httpx==0.28.1",
  "mypy==2.3.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "psycopg[binary]==3.3.6",
  "pytest==8.4.2",
  "pyyaml==6.0.3",
  "redis==8.1.0",
  "ruff==0.16.9",
  "scikit-learn>=1.4.0",
  "scipy>=1.12.0",
  "pyproj>=3.6.0",
  "shapely==2.1.2",
  "sqlalchemy==2.0.54",
  "uvicorn[standard]==0.35.0",
  "wildfire-core",
]

[tool.uv.workspace]
members = [
  "packages/wildfire_core",
  "apps/api_gateway",
  "apps/ingest_worker",
  "apps/agents/fire",
  "apps/agents/weather",
  "apps/agents/routing",
  "apps/coordinator",
]

[tool.uv.sources]
agent-routing = { workspace = true }
coordinator = { workspace = true }
wildfire-core = { workspace = true }

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = ["hypothesis==6.168.3", "types-networkx", "types-pyyaml==6.0.12.20250915"]

[tool.pytest.ini_options]
markers = ["compose: requires the local Docker Compose services"]
pythonpath = [
  "packages/wildfire_core/src",
  "apps/api_gateway/src",
  "apps/ingest_worker/src",
  "apps/agents/fire/src",
  "apps/agents/weather/src",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = [
  "packages/wildfire_core/src",
  "apps/agents/fire/src",
  "apps/agents/weather/src",
  "apps/ingest_worker/src",
]

[[tool.mypy.overrides]]
module = [
  "scipy.*",
  "shapely.*",
  "pyproj.*",
  "sklearn.*",
]
ignore_missing_imports = true
