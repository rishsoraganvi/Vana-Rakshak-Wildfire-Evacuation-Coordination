[project]
name = "wildfire-core"
version = "0.1.0"
description = "Shared configuration and database boundary for Vana-Rakshak"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "psycopg[binary]==3.3.6",
  "pyproj>=3.6.0",
  "pyyaml==6.0.3",
  "redis==8.1.0",
  "shapely>=2.0.0",
  "sqlalchemy==2.0.54",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wildfire_core"]
