services:
  postgres:
    build:
      context: .
      dockerfile: infra/docker/postgres/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wildfire}
      POSTGRES_USER: ${POSTGRES_USER:-wildfire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4.2@sha256:fbdbaea47b9ae4ecc2082ecdb4e1cea81e32176ffb1dcf643d422ad07427e5d9
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wildfire}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-wildfire}
      REDIS_URL: redis://redis:6379/0
      AOI_BBOX: ${AOI_BBOX:-76.0,11.5,77.3,12.4}
      PILOT_CLUSTER_ID: ${PILOT_CLUSTER_ID:-bandipur}
    ports:
      - "127.0.0.1:${API_GATEWAY_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')\""]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
